unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

unbind C-\\
set -g prefix2 C-\\
bind-key C-\\ send-prefix

bind r source-file ~/.tmux.conf \; display 'Tmux reloaded'
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -s escape-time 0
set -g mouse on
set -g status-keys emacs
set-option -g status-position top
set -g detach-on-destroy off  

# synchronize panes toggle
bind C-s set-window-option synchronize-panes
bind q switch-client -t'{marked}'

# copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'
unbind P
bind P paste-buffer

# split panes using | and - (inherit cwd)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# window navigation
setw -g automatic-rename off   
setw -g mode-keys vi        
setw -g pane-base-index 1
setw -g aggressive-resize on
set -g base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g status-interval 10

# switch panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize pane -- no prefix, hold Alt+Shift and tap
bind -n M-H resize-pane -L 2
bind -n M-J resize-pane -D 2
bind -n M-K resize-pane -U 2
bind -n M-L resize-pane -R 2

# Bind Alt+hl to move to the window
bind -n M-h previous-window
bind -n M-l next-window

# kill pane, window
unbind-key x
bind-key x kill-pane
bind-key X confirm-before -p "kill-session #S? (y/n)" kill-session

# link open
set -g @fzf-url-bind 'u'

# session wizard
#set -g @session-wizard 't'

# thumb config
set -g @thumbs-key f
set -g @thumbs-command 'echo -n {} | wl-copy'

# Floating key bind
set -g @floax-bind '-n M-p'

# decide whether we're in a Vim process
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# NOTE: no root-table C-\ bind here -- C-\ is prefix2 (see top of file), and
# tmux matches prefix keys before the root table, so such a bind can never fire.

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+

# sesh session manager
bind-key "t" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 85%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:60%' \
    --preview 'sesh preview {}'
)\""
bind -N "last-session (via sesh)" L run-shell "sesh last"

# clear screen
bind C-l send-keys 'C-l'

# easymotion config
set -g @easymotion-key 's'

# pane switch   
set -g @fzf_pane_switch_bind-key 'o'
set -g @fzf_pane_switch_preview-pane "false"

# plugins
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @plugin 'kristijan/tmux-fzf-pane-switch'
set -g @plugin 'ddzero2c/tmux-easymotion'
set -g @plugin 'MeinardEdrei/tmux-spotlight'

# theme config
set -g @minimal-tmux-status "top"

run-shell ~/.tmux/plugins/tmux-thumbs/tmux-thumbs.tmux

# install tmp for new machine
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
