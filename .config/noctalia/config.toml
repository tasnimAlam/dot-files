[bar.top]
thickness = 40
background_opacity = 0.6
scale = 1.15  
margin_ends = 2
capsule = true
capsule_thickness = 0.8
capsule_radius = 20

start = ["launcher", "workspaces"]
center = ["media"]
end = ["weather","battery", "volume", "bluetooth","network","clock", "tray", "session","notifications"]

[widget.launcher]
type = "custom_button"
glyph = ""
capsule_padding = 8.0
label = "󰣇"

[widget.launcher.actions]
left = "exec vicinae toggle"

[widget.media]
hide_when_no_media = true

[widget.clock]
format = "{:%a  %-I:%M %p}"

[widget.bluetooth]
show_label = true

[widget.weather]
show_condition = false
