[mgr]
linemode = "size"
sort_dir_first = true
sort_reverse = true
show_permissions = true

[tasks]
# Hide background preloader tasks (e.g. video thumbnails) from the task list,
# so they don't trigger "unfinished tasks, quit anyway?".
suppress_preload = true

[opener]
epub = [
	{ run = "foliate %s1", desc = "Foliate", for = "linux", orphan = true },
]
# Override the default `open`, which lacks `orphan` on linux and so keeps
# xdg-open as a tracked task ("unfinished tasks, quit anyway?").
open = [
	{ run = "xdg-open %s1", desc = "Open", for = "linux", orphan = true },
]

play = [
  { run = 'open-return mpv %s', orphan = true, desc = "Play & return", for = "unix" },
]

[open]
prepend_rules = [
	{ mime = "application/epub+zip", use = "epub" },
  { mime = "video/*", use = "play" },
  { mime = "audio/*", use = "play" },
]


[plugin]
prepend_previewers = [
	# Archive previewer
	{ mime = "application/epub+zip",        run = "epub-preview" },
	{ mime = "application/*zip",            run = "ouch" },
	{ mime = "application/x-tar",           run = "ouch" },
	{ mime = "application/x-bzip2",         run = "ouch" },
	{ mime = "application/x-7z-compressed", run = "ouch" },
	{ mime = "application/x-rar",           run = "ouch" },
  { mime = "application/x-xz",            run = "ouch" },
	{ mime = "application/xz",              run = "ouch" },
  { url = "*.md",     run = 'faster-piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dracula -- "$1"' },
  { url = "*.tar*",   run = 'faster-piper --format=url -- tar tf "$1"' },
  { url = "*.txt.gz", run = 'faster-piper --rely-on-preloader' },
]

prepend_fetchers = [
 { id = "git", url = "*",  run = "git", group = "git" },
 { id = "git", url = "*/", run = "git", group = "git" },
]
