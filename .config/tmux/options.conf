# Server, session and window options.

# Terminal / colours
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

set -s escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g mouse on
set -g history-limit 50000

# Status line
set -g status-keys emacs
set -g status-position bottom
set -g status-interval 10

# Sessions / windows
set -g detach-on-destroy off
set -g base-index 1
set -g renumber-windows on
setw -g pane-base-index 1
setw -g automatic-rename off
setw -g aggressive-resize on
setw -g mode-keys vi

# Let programs talk to the terminal directly through tmux -- yazi's image
# previews use the Kitty graphics protocol and render blank without this.
set -g allow-passthrough on

# 750ms is too short to read reload / power-zoom messages.
set -g display-time 1500

# Show the tmux session in the terminal/taskbar title.
set -g set-titles on
set -g set-titles-string '#S:#W'

# Let Neovim distinguish C-S-<key> from C-<key>.
set -g extended-keys on
