# Key bindings.

# Prefix: C-Space, with C-\ as a secondary prefix.
unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

unbind C-\\
set -g prefix2 C-\\
bind-key C-\\ send-prefix

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display 'Tmux reloaded'

# Session / window picker
unbind w
bind w choose-tree -ZsN
bind q switch-client -t'{marked}'

# Splits and new windows inherit the current pane's cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Toggle synchronised panes
bind C-s set-window-option synchronize-panes

# Copy mode (Wayland clipboard)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'
unbind P
bind P paste-buffer

# Pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes: no prefix, hold Alt+Shift and tap
bind -n M-H resize-pane -L 2
bind -n M-J resize-pane -D 2
bind -n M-K resize-pane -U 2
bind -n M-L resize-pane -R 2

# Window navigation: no prefix
bind -n M-h previous-window
bind -n M-l next-window

# Kill pane / session
unbind-key x
bind-key x kill-pane
bind-key X confirm-before -p "kill-session #S? (y/n)" kill-session

# Clear screen (prefix C-l, since C-l is taken by pane navigation below)
bind C-l send-keys 'C-l'

# vim-tmux-navigator style pane movement: pass the key through when the pane
# is running Vim, otherwise move panes.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# NOTE: no root-table C-\ bind here -- C-\ is prefix2 (see top of file), and
# tmux matches prefix keys before the root table, so such a bind can never fire.

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+

# sesh session manager
bind-key "t" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 85%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:60%' \
    --preview 'sesh preview {}'
)\""
bind -N "last-session (via sesh)" L run-shell "sesh last"
