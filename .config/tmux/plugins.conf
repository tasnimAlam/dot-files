# Plugins and their settings. TPM must be initialised last; see tmux.conf.
#
# Plugins are cloned into ~/.tmux/plugins (TPM's default), not this directory.

# TPM itself, so <prefix> U can update it.
set -g @plugin 'tmux-plugins/tpm'

# tmux-fzf-url -- open URLs from the scrollback
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-bind 'u'
set -g @fzf-url-history-limit '5000'

# tmux-thumbs -- hint-based copy
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-key f
set -g @thumbs-command 'echo -n {} | wl-copy'
set -g @thumbs-regexp-1 '\b(?:build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(?:\([^)]+\))?!?: .+' # git commit
set -g @thumbs-regexp-2 '[\w.+-]+@[\w-]+(?:\.[\w-]+)+' # email

# tmux-floax -- floating pane
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind '-n M-p'
set -g @floax-bind-menu 'P'   # plugin default; stated so it is not a surprise

# minimal-tmux-status -- status line theme
set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @minimal-tmux-status "bottom"
set -g @minimal-tmux-status-right '#(gitmux "#{pane_current_path}")'

# agent-radar - see every running coding agent. <prefix> a is the plugin's
# own default; set it here so the key is visible when reading this file.
set -g @plugin 'vieitesss/agent-radar'
set -g @agent-radar-key 'a'

# tmux-fuzzback - fuzzy finder scrollback buffer
set -g @plugin 'roosta/tmux-fuzzback'
set -g @fuzzback-bind ?

# tmux-easymotion - jump to any visible pane
set -g @plugin 'ddzero2c/tmux-easymotion'
set -g @easymotion-s 's'

# tmux-power-zoom - zoom pane to separate window
set -g @plugin 'jaclu/tmux-power-zoom'
set -g @power_zoom_without_prefix 'Yes'
set -g @power_zoom_trigger 'M-m'
