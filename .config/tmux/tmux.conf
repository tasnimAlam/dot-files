# tmux configuration entry point (~/.config/tmux/tmux.conf).
#
# Split across:
#   options.conf  -- server/session/window options
#   keys.conf     -- key bindings
#   plugins.conf  -- @plugin declarations and plugin settings
#
# Reload with <prefix> r.

source-file ~/.config/tmux/options.conf
source-file ~/.config/tmux/keys.conf
source-file ~/.config/tmux/plugins.conf

# Plugins live in ~/.tmux/plugins, but TPM defaults to ~/.config/tmux/plugins
# whenever an XDG tmux.conf exists -- pin the path or it finds nothing and
# silently loads no plugins.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# Bootstrap TPM on a fresh machine.
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Keep this line at the very bottom.
run '~/.tmux/plugins/tpm/tpm'
